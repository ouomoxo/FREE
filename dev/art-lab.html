<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MAESTRO · art lab</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>
  body { overflow: auto; padding: 32px; }
  h2 { font-size: 12px; letter-spacing: .2em; color: var(--c-text-dim); margin: 32px 0 12px; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
  .cell { border: 1px solid var(--c-line); padding: 8px; background: var(--c-surface); }
  .cell canvas { width: 100%; height: auto; }
  .cell .cap { font-size: 10px; letter-spacing: .12em; color: var(--c-text-dim); margin-top: 8px; text-transform: uppercase; }
  .strip { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
  .type { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
</style>
</head>
<body class="scroll">
  <h2>Bitmap face</h2>
  <div class="type">
    <px-text text="MAESTRO" scale="8" color="#ece7dc"></px-text>
    <px-text text="THE CONDUCTOR'S HANDS" scale="3" color="#d9b978"></px-text>
    <px-text text="ABCDEFGHIJKLM" scale="2" color="#8d8a84"></px-text>
    <px-text text="NOPQRSTUVWXYZ" scale="2" color="#8d8a84"></px-text>
    <px-text text="0123456789 .,!?'-:/&()" scale="2" color="#8d8a84"></px-text>
    <px-text text="DOT MATRIX" scale="6" gap="1" color="#ece7dc"></px-text>
  </div>

  <h2>Motifs · bone</h2>
  <div class="grid" id="motifs"></div>

  <h2>Palettes · motif "hands"</h2>
  <div class="grid" id="palettes"></div>

  <h2>Hand rig</h2>
  <div class="strip" id="hands"></div>

  <script type="module">
    import { MOTIFS, renderCover } from '../js/pixel/art.js';
    import { PALETTES } from '../js/pixel/dither.js';
    import { PixelSurface } from '../js/pixel/surface.js';
    import { drawHand, batonHand, shapingHand } from '../js/pixel/hand.js';
    import '../js/pixel/font.js';

    const mk = (canvas, label) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.appendChild(canvas);
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = label;
      cell.appendChild(cap);
      return cell;
    };

    const motifs = document.getElementById('motifs');
    for (const name of Object.keys(MOTIFS)) {
      motifs.appendChild(mk(renderCover({ seed: 'lab-' + name, motif: name, palette: 'bone', scale: 4 }), name));
    }

    const pal = document.getElementById('palettes');
    for (const name of Object.keys(PALETTES)) {
      pal.appendChild(mk(renderCover({ seed: 'pal', motif: 'hands', palette: name, scale: 4 }), name));
    }

    const hands = document.getElementById('hands');
    const poses = [
      ['baton', batonHand({ x: 46, y: 92, scale: 13 })],
      ['shaping', shapingHand({ x: 46, y: 60, scale: 13 })],
      ['fist', batonHand({ x: 46, y: 92, scale: 13, curl: [0.95, 1, 1, 1], thumbCurl: 0.9 })],
      ['open', shapingHand({ x: 46, y: 60, scale: 13, curl: [0.02, 0, 0.02, 0.06], spread: [-0.34, -0.1, 0.16, 0.42] })],
      ['upbeat', batonHand({ x: 46, y: 100, scale: 13, baton: -1.35, palmAngle: -0.8, forearmAngle: 2.2 })],
      ['downbeat', batonHand({ x: 46, y: 70, scale: 13, baton: 0.35, palmAngle: 0.1, forearmAngle: 2.7 })],
    ];
    for (const [label, pose] of poses) {
      const c = document.createElement('canvas');
      const s = new PixelSurface(c, { width: 92, height: 128, scale: 3 });
      s.ctx.clearRect(0, 0, 92, 128);
      drawHand(s.ctx, pose);
      s.present({ palette: 'bone', strength: 0.85, gamma: 0.95 });
      c.style.width = (92 * 3) + 'px';
      const cell = mk(c, label);
      cell.style.width = 'auto';
      hands.appendChild(cell);
    }
  </script>
</body>
</html>
